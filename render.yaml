services:
  - type: web
    name: media-cable-vision-staging
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile.staging
    healthCheckPath: /api/health
    envVars:
      - key: STAGING_PASSWORD
        generateValue: true
      - key: POSTGRES_HOST
        fromDatabase:
          name: media-cable-vision-staging
          property: host
      - key: POSTGRES_DB
        fromDatabase:
          name: media-cable-vision-staging
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: media-cable-vision-staging
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: media-cable-vision-staging
          property: password
databases:
  - name: media-cable-vision-staging
    region: singapore
    plan: free
    postgresMajorVersion: "17"
    ipAllowList: []

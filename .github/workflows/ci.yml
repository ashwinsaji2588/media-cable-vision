name: Build and test
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: media_cable_vision
          POSTGRES_USER: mcv
          POSTGRES_PASSWORD: mcv_local
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U mcv -d media_cable_vision"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      MCV_RUN_POSTGRES_TESTS: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -ntp -f backend/pom.xml verify
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up --build --wait --wait-timeout 120
        env:
          NOTIFICATION_INTERVAL_MS: "250"
      - run: node scripts/smoke.mjs
      - name: Verify mock delivery and persistence
        run: |
          for attempt in {1..20}; do
            count=$(docker compose exec -T db psql -U mcv -d media_cable_vision -Atc "SELECT count(*) FROM notification_outbox WHERE status = 'SENT'")
            if [ "$count" = 4 ]; then exit 0; fi
            sleep 1
          done
          exit 1
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down

name: Weekly Provider Tariff Sync

on:
  schedule:
    # Runs every Monday at 03:00 UTC (08:30 AM IST)
    - cron: "0 3 * * 1"
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run Tariff Sync Scraper
        run: node scripts/sync-plans.mjs

      - name: Verify Next.js Build with Updated Plans
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status -s frontend/app/plans-data.json) ]]; then
            git add frontend/app/plans-data.json
            git commit -m "chore(plans): weekly sync provider tariffs [skip ci]"
            git push
            echo "✓ Updated provider tariffs pushed to repository."
          else
            echo "✓ No tariff changes detected this week."
          fi

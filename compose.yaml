services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-media_cable_vision}
      POSTGRES_USER: ${POSTGRES_USER:-mcv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mcv_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-media_cable_vision}
      POSTGRES_USER: ${POSTGRES_USER:-mcv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mcv_local}
      NOTIFICATION_MODE: ${NOTIFICATION_MODE:-mock}
      NOTIFICATION_INTERVAL_MS: ${NOTIFICATION_INTERVAL_MS:-5000}
      NOTIFICATION_RECIPIENT: ${NOTIFICATION_RECIPIENT:-}
      WHATSAPP_GRAPH_VERSION: ${WHATSAPP_GRAPH_VERSION:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_TEMPLATE: ${WHATSAPP_TEMPLATE:-}
      WHATSAPP_LANGUAGE: ${WHATSAPP_LANGUAGE:-en}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_SENDER: ${TWILIO_SENDER:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 18
  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8080
      SITE_URL: ${SITE_URL:-}
      PUBLIC_PHONE: ${PUBLIC_PHONE:-}
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  postgres_data:
